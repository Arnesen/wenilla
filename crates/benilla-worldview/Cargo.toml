[package]
name = "benilla-worldview"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The world viewer: the engine with no game attached — and the wall that keeps the split honest (decision 1160)"

[dependencies]
# **Only the engine.** This is the edge the binary exists to hold: if a world concept
# ever needs the game, this line is what refuses to let it.
benilla-world = { path = "../benilla-world" }

[build-dependencies]
benilla-buildstamp = { path = "../benilla-buildstamp" }

[[bin]]
name = "benilla-worldview"
path = "src/main.rs"
# Same reason as the `benilla` shim: test-building this bin would relink the app in the test
# profile on every sha change, which is the tax the shims exist to kill (decision 0993).
test = false
