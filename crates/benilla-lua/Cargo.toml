[package]
name = "benilla-lua"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The Lua interpreter benilla's script host runs: 5.1.5 with the 1.12.1 client's grammar, its state as plain Rust data"

[lints]
workspace = true

[dependencies]

# wenilla: the start-up seed's wall clock in a page, where std's panics.
[target.'cfg(target_arch = "wasm32")'.dependencies]
web-time = "1"

[dev-dependencies]
benilla-formats = { path = "../benilla-formats" }
roxmltree = "0.20"
