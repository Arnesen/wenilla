{% extends "base.html" %}
{% block title %}{{ realm_name }} — sign in{% endblock %}
{% block brand %}{{ realm_name }}{% endblock %}
{% block content %}
<div class="card" style="max-width:26rem;margin:3rem auto">
  <h1>Sign in</h1>
  {% if let Some(e) = error %}<div class="flash error">{{ e }}</div>{% endif %}
  <form method="post" action="/login">
    <label for="u">Username</label><input id="u" name="username" type="text" autocomplete="username" autofocus required>
    <label for="p">Password</label><input id="p" name="password" type="password" autocomplete="current-password" required>
    <p><button type="submit">Sign in</button></p>
  </form>
  <p class="muted">No account? Ask the realm's admin.</p>
</div>
{% endblock %}
