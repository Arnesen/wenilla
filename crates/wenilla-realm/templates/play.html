<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Play</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #000; }
  #benilla { display: block; width: 100vw; height: 100vh; }
  #bar { position: fixed; top: 0; right: 0; padding: .3rem .6rem; font: 12px system-ui, sans-serif; color: #999; background: rgba(0,0,0,.55); border-bottom-left-radius: 6px; z-index: 10; }
  #bar a, #bar button { color: #ddd; background: none; border: 0; cursor: pointer; font: inherit; margin-left: .6rem; text-decoration: underline; }
  #msg { position: fixed; inset: 0; display: grid; place-items: center; color: #ccc; font: 16px system-ui, sans-serif; background: #000; }
  #msg.hidden { display: none; }
</style>
<script>
  // Sound: the browser suspends any AudioContext created before the first user gesture, and the
  // mixer creates its at startup — resume every context on the first click/key.
  (() => {
    const contexts = [];
    for (const name of ['AudioContext', 'webkitAudioContext']) {
      const Orig = window[name];
      if (!Orig) continue;
      const Patched = function (...args) { const ctx = new Orig(...args); contexts.push(ctx); return ctx; };
      Patched.prototype = Orig.prototype;
      window[name] = Patched;
    }
    const resume = () => { for (const ctx of contexts) if (ctx.state !== 'running') ctx.resume().catch(() => {}); };
    for (const ev of ['pointerdown', 'keydown', 'touchstart']) window.addEventListener(ev, resume, { capture: true, passive: true });
  })();
</script>
<script type="importmap">{"imports":{"wasi_snapshot_preview1":"./wasi_stubs.js"}}</script>
</head>
<body>
<div id="bar">{{ user.display_name }} {% if user.is_admin() %}<a href="/admin">admin</a>{% endif %}<a href="/account/password">password</a><button type="button" id="fs" title="Full screen. Captures Esc, Tab and Ctrl+W for the game — press and hold Esc to leave.">full screen</button><form style="display:inline" method="post" action="/logout"><button type="submit">sign out</button></form></div>
<div id="msg">Loading the realm…</div>
<canvas id="benilla"></canvas>
<script type="module">
  // #msg covers only the pre-boot failures (no WebGPU, credential fetch); the moment boot()
  // takes over, its own overlay owns all progress — the old code hid #msg here and then did
  // every expensive thing (download, compile, the catalog frame) behind a black canvas.
  const msg = document.getElementById('msg');
  if (!navigator.gpu) {
    msg.textContent = 'This browser has no WebGPU. Use a current Chrome or Edge (on Linux: chrome://flags/#enable-unsafe-webgpu).';
    throw new Error('no webgpu');
  }
  // Full-screen key capture + durable settings storage (web/platform.js). Imported dynamically
  // and never awaited: these are conveniences, and a *static* import that failed to resolve —
  // one forgotten line in scripts/web-build.sh — would stop this whole module from executing,
  // costing the credential fetch and the boot. Both calls sit after the WebGPU gate so a
  // browser that cannot run the client is never asked for storage nor shown a dead button.
  import('./platform.js')
    .then(({ installFullscreenToggle, requestPersistentStorage }) => {
      requestPersistentStorage();
      installFullscreenToggle(document.getElementById('fs'), {
        focusTarget: document.getElementById('benilla'),
      });
    })
    .catch((e) => console.warn('platform.js:', e));
  // The game credentials come over this authenticated session, never through the URL. The
  // client reads them from `window.__wenilla_env` once during boot, then the global is dropped.
  const r = await fetch('/api/play', { headers: { 'X-Requested-With': 'wenilla' }, credentials: 'same-origin' });
  if (r.status === 401) { location.href = '/login'; throw new Error('not signed in'); }
  if (!r.ok) { msg.textContent = 'Could not fetch your realm credentials (' + r.status + '). Try again in a minute.'; throw new Error('play ' + r.status); }
  const env = await r.json();
  window.__wenilla_env = { user: env.user, pass: env.pass, host: env.host, ...(env.dev_query_creds ? { dev_query_creds: '1' } : {}) };
  const { default: init } = await import('./wenilla.js');
  const { bind } = await import('./wasi_stubs.js');
  const { boot } = await import('./boot.js');
  msg.remove(); // boot()'s overlay takes over from here — see web/boot.js
  const w = await boot(init);
  bind(w.memory);
  delete window.__wenilla_env;
</script>
</body>
</html>
