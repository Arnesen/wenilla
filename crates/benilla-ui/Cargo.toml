[package]
name = "benilla-ui"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Engine-free WoW UI engine core: TOC and FrameXML parsing, templates, anchors, z-order"

[lints]
workspace = true

[dependencies]
# Wall-clock reads (`SystemTime::now`) go through `web-time`: a re-export of std's on native, and
# `Date.now()` in a browser, where std's panics on first use.
web-time = "1"
roxmltree = "0.20"
# The script host's Lua: benilla's own interpreter, through a crate that answers to the name
# `mlua` (`src/lib.rs`).
benilla-mlua = { path = "../benilla-mlua" }
