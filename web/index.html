<script>
  // Sound: the browser suspends any AudioContext created before the first user gesture (autoplay
  // policy), and the mixer (kira/cpal) creates its at startup and never resumes it — so the tab
  // stayed silent. Remember every context the page creates and resume them on the first
  // click/key, which is the only place a browser lets that happen.
  (() => {
    const contexts = [];
    for (const name of ['AudioContext', 'webkitAudioContext']) {
      const Orig = window[name];
      if (!Orig) continue;
      const Patched = function (...args) {
        const ctx = new Orig(...args);
        contexts.push(ctx);
        return ctx;
      };
      Patched.prototype = Orig.prototype;
      window[name] = Patched;
    }
    const resume = () => {
      console.log(`audio: gesture — ${contexts.length} context(s): ${contexts.map((c) => c.state).join(',') || 'none'}`);
      for (const ctx of contexts) {
        if (ctx.state !== 'running') {
          ctx.resume().then(() => console.log(`audio: context resumed (${ctx.state})`), () => {});
        }
      }
    };
    for (const ev of ['pointerdown', 'keydown', 'touchstart']) {
      window.addEventListener(ev, resume, { capture: true, passive: true });
    }
  })();
</script>

<script>
  // WGSL compile errors are otherwise invisible: wgpu's browser backend never asks the module for
  // its compilation info, so Chrome only prints the "[Invalid ShaderModule] … previous error"
  // cascade. Ask on its behalf and print the real diagnostics — cheap, and only speaks on errors.
  if (navigator.gpu && window.GPUDevice) {
    const orig = GPUDevice.prototype.createShaderModule;
    GPUDevice.prototype.createShaderModule = function (desc) {
      const m = orig.call(this, desc);
      m.getCompilationInfo().then((info) => {
        const errs = info.messages.filter((x) => x.type === 'error');
        if (!errs.length) return;
        const lines = (desc.code || '').split('\n');
        for (const e of errs) {
          console.error(`WGSL error in ${desc.label || '(unlabeled)'} @${e.lineNum}:${e.linePos}: ${e.message}\n    ${lines[e.lineNum - 1] || ''}`);
        }
      });
      return m;
    };
  }
</script>
<button type="button" id="fs" title="Full screen. Captures Esc, Tab and Ctrl+W for the game — press and hold Esc to leave.">full screen</button>
<canvas id="benilla"></canvas>
<script>
  // Dev page: allow `?user=&pass=&char=` links to log in. A hosting page that fetched the
  // credentials itself sets `window.__wenilla_env = {user, pass, host}` here instead, and the
  // client then never reads credentials from the URL (`benilla_app::webenv`).
  window.__wenilla_env = { dev_query_creds: '1' };
</script>
<script type="module">
  import init from './wenilla.js';
  import { bind } from './wasi_stubs.js';
  import { boot } from './boot.js';
  // `boot(init)` is the loading overlay + parallel data prefetch (see boot.js's header); it calls
  // `init()` with a byte-counted Response, and `init()` instantiates the wasm module, which runs
  // `#[wasm_bindgen(start)] start()` as part of instantiation (`wenilla/src/lib.rs`) — that's the
  // whole boot, canvas included (`boot.rs` binds to `#benilla` by id, so no query/lookup belongs
  // here). `bind(w.memory)` comes AFTER on purpose: the wasm Lua VM's WASI shims
  // (`wasi_stubs.js`'s own header) can only zero a WASI caller's out-pointers once the module's
  // linear memory exists to write into, and `init()` is what creates it.
  // Full-screen key capture (Esc/Tab/Ctrl+W reach the game) + durable settings storage. Same
  // module and same contract as the realm page: dynamic, unawaited, and never load-bearing —
  // see web/platform.js. The dev page has no WebGPU gate to sit behind, so on a browser that
  // prompts for persistent storage (Firefox) this is where the player would see it.
  import('./platform.js')
    .then(({ installFullscreenToggle, requestPersistentStorage }) => {
      requestPersistentStorage();
      installFullscreenToggle(document.getElementById('fs'), {
        focusTarget: document.getElementById('benilla'),
      });
    })
    .catch((e) => console.warn('platform.js:', e));
  const w = await boot(init);
  bind(w.memory);
</script>
