<!doctype html>
<meta charset="utf-8">
<title>benilla</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #000; }
  #benilla { display: block; width: 100vw; height: 100vh; }
</style>
<script type="importmap">{"imports":{"wasi_snapshot_preview1":"./wasi_stubs.js"}}</script>
<script>
  // WGSL compile errors are otherwise invisible: wgpu's browser backend never asks the module for
  // its compilation info, so Chrome only prints the "[Invalid ShaderModule] … previous error"
  // cascade. Ask on its behalf and print the real diagnostics — cheap, and only speaks on errors.
  if (navigator.gpu && window.GPUDevice) {
    const orig = GPUDevice.prototype.createShaderModule;
    GPUDevice.prototype.createShaderModule = function (desc) {
      const m = orig.call(this, desc);
      m.getCompilationInfo().then((info) => {
        const errs = info.messages.filter((x) => x.type === 'error');
        if (!errs.length) return;
        const lines = (desc.code || '').split('\n');
        for (const e of errs) {
          console.error(`WGSL error in ${desc.label || '(unlabeled)'} @${e.lineNum}:${e.linePos}: ${e.message}\n    ${lines[e.lineNum - 1] || ''}`);
        }
      });
      return m;
    };
  }
</script>
<canvas id="benilla"></canvas>
<script type="module">
  import init from './benilla_web.js';
  import { bind } from './wasi_stubs.js';
  // `init()` instantiates the wasm module, which runs `#[wasm_bindgen(start)] start()` as part of
  // instantiation (`benilla-web/src/lib.rs`) — that's the whole boot, canvas included
  // (`boot.rs` binds to `#benilla` by id, so no query/lookup belongs here). `bind(w.memory)` comes
  // AFTER `init()` on purpose: the wasm Lua VM's WASI shims (`wasi_stubs.js`'s own header) can only
  // zero a WASI caller's out-pointers once the module's linear memory exists to write into, and
  // `init()` is what creates it.
  const w = await init();
  bind(w.memory);
</script>
